# ~/.config/tmux/tmux.conf  (tmux reads this XDG path natively)
#
# Prefix is Ctrl-Space. Ctrl-b is kept as a backup prefix (prefix2).
# All other keys are tmux defaults: % and " to split, and so on.
#
# Cheat sheet (in a shell): tkeys

# ── Behaviour ────────────────────────────────────────────────
set -g mouse on                 # click panes, drag borders, scroll
set -g base-index 1             # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1       # panes start at 1 too
set -g renumber-windows on      # no gaps after closing a window
set -g history-limit 50000      # scrollback lines per pane
set -sg escape-time 10          # Esc reaches nvim / hoocode immediately
set -g focus-events on          # nvim notices when files change on disk
set -g set-clipboard on         # copies from tmux reach the macOS clipboard
set -g display-time 2500        # messages stay long enough to read

# Ghostty: true colour + extended keys so Alt/Shift chords reach hoocode
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys"
set -s extended-keys on
set -s extended-keys-format csi-u

# ── Prefix: Ctrl-Space, Ctrl-b as backup ────────────────────
set -g prefix C-Space
set -g prefix2 C-b
# Ctrl-Space twice sends one Ctrl-Space to the app (nvim completion)
bind C-Space send-prefix

# ── Look: Catppuccin Latte/Mocha follows macOS, never colour-alone ─
# Theme colours live in themes/light.conf (Latte) + themes/dark.conf (Mocha).
# scripts/appearance picks the right one from macOS appearance.
run-shell "~/.config/tmux/scripts/appearance"
run-shell -b "~/.config/tmux/scripts/appearance --watch"
set-hook -g client-attached "run-shell ~/.config/tmux/scripts/appearance"
set-hook -g after-new-session "run-shell ~/.config/tmux/scripts/appearance"
set-hook -g client-session-changed "run-shell ~/.config/tmux/scripts/appearance"
source-file ~/.config/tmux/themes/light.conf
# Status bar (bottom). Mirrors the Neovim lualine bar: a powerline arrow
# after the session badge; state shown as text (PREFIX, COPY, ZOOM, [ ]).
# status-style is set in the theme files; formats read #{@...} colours.
# Conditionals avoid commas inside #[...] (tmux would split on them).
set -g status-position bottom
set -g status-interval 5        # refresh so the git branch stays current
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{@accent_fg},bg=#{@accent_bg},bold]  #{=/16/…:session_name} #[nobold,fg=#{@accent_bg},bg=#{@bar_bg}] "
set -g status-right "#{?client_prefix,#[fg=#{@prefix_fg}]#[bg=#{@prefix_bg}]#[bold] PREFIX #[nobold]#[fg=#{@muted_fg}]#[bg=#{@bar_bg}] │ ,}#{?pane_in_mode,#[fg=#{@copy_fg}]#[bg=#{@copy_bg}]#[bold] COPY #[nobold]#[fg=#{@muted_fg}]#[bg=#{@bar_bg}] │ ,}#[fg=#{@muted_fg}]#(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null | sed -n 's/.*/  & │ /p')#[fg=#{@muted_fg}]C-Space ? keys │ #[fg=#{@bar_fg}]#[bold]%H:%M "
setw -g window-status-format "#[fg=#{@muted_fg},bg=#{@bar_bg}] #I #{=/20/…:window_name}#{?window_activity_flag,#[fg=#{@bar_fg}]#[bold] •#[nobold],} "
setw -g window-status-current-format "#[fg=#{@tab_fg},bg=#{@tab_bg},bold] [#I #{=/20/…:window_name}#{?window_zoomed_flag, ZOOM,}] #[nobold,fg=#{@muted_fg},bg=#{@bar_bg}]"
setw -g monitor-activity on     # marks • on windows with new output

# Pane borders: titles hidden to save a row (see below)
set -g pane-border-status off
set -g pane-border-lines heavy
# titles hidden to save a row; set pane-border-status top to bring back
# set -g pane-border-format " #{pane_index}: #{pane_title} "

set -g popup-border-lines rounded
# Colours come from themes/light.conf or themes/dark.conf (see above).

# ── Plugins (TPM) ────────────────────────────────────────────
# Install TPM once:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Then: prefix + I  installs plugins, prefix + U  updates them.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# continuum: autosave every 15 min, restore on server start
set -g @continuum-restore 'on'
# resurrect: keep pane text, and relaunch nvim / hoocode / agentdiff
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~nvim" "~hoocode" "~agentdiff"'

# ── Unified with rex (prefix Ctrl-Space, Ctrl-b backup — same as rex) ──
# hjkl focus (rex: prefix h/j/k/l). Arrows keep working too.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# < > move window left/right (rex: prefix < > for tabs).
bind < swap-window -d -t -1
bind > swap-window -d -t +1
# b hides the status bar (tmux has no sidebar; this is its equivalent).
# rex/herdr: same key toggles the real sidebar.
bind b set-option -g status
# P renames the pane (asks for the name).
# rex/herdr: prefix P — same key.
bind P command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"
# Kill stays on & (asks confirm); rex X kills directly — different on purpose.

# Keep this as the LAST line.
run '~/.config/tmux/plugins/tpm/tpm'
