# Catppuccin Mocha AAA — night / dark mode
# WCAG AAA (>= 7:1): same hues as stock Mocha, OKLCH lightness nudges
# (same method as rex/themes/make_aaa.py). Backgrounds stay stock.
set -g status-style "bg=#11111b,fg=#dde5ff"
setw -g window-status-style "bg=#11111b,fg=#bbc2dd"
setw -g window-status-current-style "bg=#313244,fg=#dde5ff,bold"
setw -g window-status-activity-style "bg=#11111b,fg=#dde5ff,bold"
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#a1c5fe"
set -g message-style "bg=#313244,fg=#dde5ff"
set -g message-command-style "bg=#313244,fg=#dde5ff"
set -g popup-style "bg=#1e1e2e,fg=#dde5ff"
set -g popup-border-style "fg=#a1c5fe"
setw -g mode-style "bg=#f9e2af,fg=#1e1e2e"
setw -g clock-mode-colour "#a1c5fe"
set -g display-panes-colour "#b5bfff"
set -g display-panes-active-colour "#a1c5fe"
# Status bar colours, read by status-left / status-right in tmux.conf.
# Format strings expand #{@name}; style strings above are set directly.
set -g @bar_bg "#11111b"        # crust: outer frame (lualine c is mantle)
set -g @bar_fg "#dde5ff"        # text: clock, activity bullet
set -g @muted_fg "#bbc2dd"      # subtext0: inactive windows, help hint, branch
set -g @accent_bg "#fab387"     # peach: session badge
set -g @accent_fg "#1e1e2e"     # base
set -g @tab_bg "#313244"        # surface0: current window
set -g @tab_fg "#dde5ff"        # text
set -g @copy_bg "#f9e2af"       # yellow: COPY badge
set -g @copy_fg "#1e1e2e"       # base
# Read by status-right in tmux.conf (PREFIX badge)
set -g @prefix_fg "#1e1e2e"
set -g @prefix_bg "#feacc1"
