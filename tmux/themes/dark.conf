# Catppuccin Mocha — night / dark mode
# Hand-written palette (no catppuccin plugin). Every text pair passes WCAG 4.5:1.
set -g status-style "bg=#11111b,fg=#cdd6f4"
setw -g window-status-style "bg=#11111b,fg=#a6adc8"
setw -g window-status-current-style "bg=#313244,fg=#cdd6f4,bold"
setw -g window-status-activity-style "bg=#11111b,fg=#cdd6f4,bold"
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#89b4fa"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#89b4fa"
set -g display-panes-colour "#b4befe"
set -g display-panes-active-colour "#89b4fa"
# Status bar colours, read by status-left / status-right in tmux.conf.
# Format strings expand #{@name}; style strings above are set directly.
set -g @bar_bg "#11111b"        # crust: outer frame (lualine c is mantle)
set -g @bar_fg "#cdd6f4"        # text: clock, activity bullet
set -g @muted_fg "#a6adc8"      # subtext0: inactive windows, help hint, branch
set -g @accent_bg "#cba6f7"     # mauve: session badge
set -g @accent_fg "#1e1e2e"     # base
set -g @tab_bg "#313244"        # surface0: current window
set -g @tab_fg "#cdd6f4"        # text
set -g @copy_bg "#f9e2af"       # yellow: COPY badge
set -g @copy_fg "#1e1e2e"       # base
# Read by status-right in tmux.conf (PREFIX badge)
set -g @prefix_fg "#1e1e2e"
set -g @prefix_bg "#fab387"
