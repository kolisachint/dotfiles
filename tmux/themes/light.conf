# Catppuccin Latte — day / light mode
# Hand-written palette (no catppuccin plugin). Every text pair passes WCAG 4.5:1.
# Swaps from the flavour palette where the first choice failed contrast:
#   accent badge: mauve bg (lualine's blue with base text is 4.34:1)
#   current window: text on surface0 (blue on surface0 is 3.18:1)
#   COPY badge: dark amber bg (yellow and peach fail with any text colour)
#   prefix badge: red bg (peach fails with base text)
#   activity: bullet + bold (peach fails on crust)
set -g status-style "bg=#dce0e8,fg=#4c4f69"
setw -g window-status-style "bg=#dce0e8,fg=#5c5f77"
setw -g window-status-current-style "bg=#ccd0da,fg=#4c4f69,bold"
setw -g window-status-activity-style "bg=#dce0e8,fg=#4c4f69,bold"
set -g pane-border-style "fg=#6c6f85"
set -g pane-active-border-style "fg=#1e66f5"
set -g message-style "bg=#ccd0da,fg=#4c4f69"
set -g message-command-style "bg=#ccd0da,fg=#4c4f69"
set -g popup-style "bg=#eff1f5,fg=#4c4f69"
set -g popup-border-style "fg=#1e66f5"
setw -g mode-style "bg=#8839ef,fg=#eff1f5"
setw -g clock-mode-colour "#8839ef"
set -g display-panes-colour "#6c6f85"
set -g display-panes-active-colour "#1e66f5"
# Status bar colours, read by status-left / status-right in tmux.conf.
# Format strings expand #{@name}; style strings above are set directly.
set -g @bar_bg "#dce0e8"        # crust: outer frame (lualine c is mantle)
set -g @bar_fg "#4c4f69"        # text: clock, activity bullet
set -g @muted_fg "#5c5f77"      # subtext1: inactive windows, help hint, branch
set -g @accent_bg "#8839ef"     # mauve: session badge
set -g @accent_fg "#eff1f5"     # base
set -g @tab_bg "#ccd0da"        # surface0: current window
set -g @tab_fg "#4c4f69"        # text
set -g @copy_bg "#7c5200"       # dark amber: COPY badge
set -g @copy_fg "#eff1f5"       # base
set -g @prefix_fg "#eff1f5"
set -g @prefix_bg "#d20f39"
