# Catppuccin Latte AAA — day / light mode
# WCAG AAA (>= 7:1): same hues as stock Latte, OKLCH lightness nudges
# (same method as rex/themes/make_aaa.py). Backgrounds stay stock.
set -g status-style "bg=#dce0e8,fg=#21223a"
setw -g window-status-style "bg=#dce0e8,fg=#393b4f"
setw -g window-status-current-style "bg=#ccd0da,fg=#21223a,bold"
setw -g window-status-activity-style "bg=#dce0e8,fg=#21223a,bold"
set -g pane-border-style "fg=#383b51"
set -g pane-active-border-style "fg=#033394"
set -g message-style "bg=#ccd0da,fg=#21223a"
set -g message-command-style "bg=#ccd0da,fg=#21223a"
set -g popup-style "bg=#eff1f5,fg=#21223a"
set -g popup-border-style "fg=#033394"
setw -g mode-style "bg=#583404,fg=#eff1f5"
setw -g clock-mode-colour "#5407a0"
set -g display-panes-colour "#383b51"
set -g display-panes-active-colour "#033394"
# Status bar colours, read by status-left / status-right in tmux.conf.
# Format strings expand #{@name}; style strings above are set directly.
set -g @bar_bg "#dce0e8"        # crust: outer frame (lualine c is mantle)
set -g @bar_fg "#21223a"        # text: clock, activity bullet
set -g @muted_fg "#393b4f"      # subtext0: inactive windows, help hint, branch
set -g @accent_bg "#5407a0"     # mauve: session badge
set -g @accent_fg "#eff1f5"     # base
set -g @tab_bg "#ccd0da"        # surface0: current window
set -g @tab_fg "#21223a"        # text
set -g @copy_bg "#583404"       # dark amber: COPY badge
set -g @copy_fg "#eff1f5"       # base
set -g @prefix_fg "#eff1f5"
set -g @prefix_bg "#7e011d"
